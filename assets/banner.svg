<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Metallic Apple / Neon Cyan Gradient -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Android Green Gradient -->
    <linearGradient id="androidGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .node-circuit { stroke: rgba(56, 189, 248, 0.25); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; letter-spacing: -0.5px; }
    .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #94a3b8; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #38bdf8; text-anchor: middle; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Animated Grid Pattern -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Dynamic Pulsing Glow Orbs (Strictly in Background) -->
  <circle cx="1060" cy="100" r="130" fill="#3ddc84" opacity="0.12">
    <animate attributeName="r" values="110;140;110" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="270" r="160" fill="#38bdf8" opacity="0.10">
    <animate attributeName="r" values="140;180;140" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="50" r="100" fill="#a855f7" opacity="0.10">
    <animate attributeName="r" values="90;120;90" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Decorative Circuit Paths & Dynamic Data Pulses -->
  <g class="node-circuit">
    <path d="M 850 180 L 980 180 L 1030 130 L 1120 130" />
    <path d="M 880 240 L 960 240 L 1000 280 L 1100 280" />
  </g>
  <!-- Moving Pulses along Circuits -->
  <circle r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 850 180 L 980 180 L 1030 130 L 1120 130" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#3ddc84" filter="url(#glow)">
    <animateMotion path="M 880 240 L 960 240 L 1000 280 L 1100 280" dur="5s" repeatCount="indefinite" />
  </circle>

  <!-- Illustrated Android & Apple Silicon Architecture Badge (Right Column) -->
  <g transform="translate(930, 75)">
    <!-- Tech Backdrop Box -->
    <rect x="0" y="0" width="200" height="210" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    
    <!-- Chip Icon (Apple Silicon / Hypervisor) -->
    <rect x="70" y="25" width="60" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Chip Pins -->
    <line x1="80" y1="18" x2="80" y2="25" stroke="#38bdf8" stroke-width="2" />
    <line x1="100" y1="18" x2="100" y2="25" stroke="#38bdf8" stroke-width="2" />
    <line x1="120" y1="18" x2="120" y2="25" stroke="#38bdf8" stroke-width="2" />
    <line x1="80" y1="85" x2="80" y2="92" stroke="#38bdf8" stroke-width="2" />
    <line x1="100" y1="85" x2="100" y2="92" stroke="#38bdf8" stroke-width="2" />
    <line x1="120" y1="85" x2="120" y2="92" stroke="#38bdf8" stroke-width="2" />
    <text x="100" y="60" class="badge-text" font-size="16">M-SERIES</text>

    <!-- Transfer Connection Arrows -->
    <path d="M 100 95 L 100 115" stroke="url(#androidGreen)" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="12;0" dur="1.5s" repeatCount="indefinite" />
    </path>

    <!-- Android Bugdroid Head Icon -->
    <g transform="translate(70, 122)">
      <!-- Head Dome -->
      <path d="M 5,28 A 25,25 0 0,1 55,28 Z" fill="url(#androidGreen)" />
      <!-- Antennas -->
      <line x1="15" y1="8" x2="22" y2="16" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round" />
      <line x1="45" y1="8" x2="38" y2="16" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round" />
      <!-- Eyes -->
      <circle cx="21" cy="22" r="2.5" fill="#0f172a" />
      <circle cx="39" cy="22" r="2.5" fill="#0f172a" />
    </g>
    
    <text x="100" y="185" class="badge-text" font-size="12" fill="#3ddc84">HYPERVISOR.FRAMEWORK</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Pill, Title, Subtitle, Badges (Clean, Unobscured) -->
  <g transform="translate(60, 50)">
    <!-- Pill Category Label -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="pill-text" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="0.5">MACOS VIRTUALIZATION &amp; ANDROID</text>

    <!-- Main Title -->
    <text x="0" y="80" class="main-title">
      Awesome <tspan fill="url(#accentCyan)">Android Emulation</tspan> on macOS
    </text>

    <!-- Subtitle Line -->
    <text x="0" y="115" class="sub-title">
      Curated Guide to Apple Silicon &amp; Intel Virtualization, Native Subsystems &amp; Device Farms
    </text>

    <!-- Architecture & Feature Highlights (Pills Row) -->
    <g transform="translate(0, 155)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="170" height="38" rx="19" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#3ddc84" />
        <text x="36" y="24" class="pill-text">Apple Silicon (M1-M5)</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(182, 0)">
        <rect width="185" height="38" rx="19" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#38bdf8" />
        <text x="36" y="24" class="pill-text">Hypervisor.framework</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(379, 0)">
        <rect width="175" height="38" rx="19" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#c084fc" />
        <text x="36" y="24" class="pill-text">QEMU / UTM / Docker</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(566, 0)">
        <rect width="170" height="38" rx="19" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <circle cx="20" cy="19" r="6" fill="#f59e0b" />
        <text x="36" y="24" class="pill-text">Cloud Device Farms</text>
      </g>
    </g>

    <!-- Bottom Metric / Tagline -->
    <g transform="translate(0, 220)">
      <text class="sub-title" font-size="13" fill="#64748b">
        ⚡ 60-120 FPS Metal/Vulkan Passthrough • 📱 Zero-Latency ADB &amp; scrcpy • ☁️ CI/CD Mobile Test Automation
      </text>
    </g>
  </g>
</svg>
